<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>User Management — SoleStock</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/sidebar.css">
</head>
<body>
<div class="app-wrapper">
  <div id="sidebar-container"></div>
  <div class="main-wrapper">
    <div id="header-container"></div>
    <main class="main-content">

      <div class="page-header">
        <div class="page-header-top">
          <div>
            <h1>User Management</h1>
            <p class="subtitle" id="userHeaderSubtitle">Manage system access, roles, and user accounts</p>
          </div>
          <button class="btn btn-primary" onclick="openAddUserModal()"><i class="bi bi-person-plus-fill"></i> Add User</button>
        </div>
      </div>

      <!-- User Stats KPI -->
      <div class="kpi-grid" style="grid-template-columns:repeat(4,1fr);margin-bottom:28px" id="userKpis"></div>

      <!-- Filter Bar -->
      <div class="filter-bar">
        <div class="search-box">
          <i class="bi bi-search"></i>
          <input type="text" class="form-control" id="userSearch" placeholder="Search by name, username, email..." oninput="renderUsers()">
        </div>
        <select class="form-control" id="filterRole" style="width:140px" onchange="renderUsers()">
          <option value="">All Roles</option>
          <option value="admin">Admin</option>
          <option value="manager">Manager</option>
          <option value="staff">Staff</option>
        </select>
        <select class="form-control" id="filterUserStatus" style="width:140px" onchange="renderUsers()">
          <option value="">All Status</option>
          <option value="active">Active</option>
          <option value="inactive">Inactive</option>
        </select>
        <button class="btn btn-secondary btn-sm" onclick="clearUserFilters()"><i class="bi bi-x-circle"></i> Clear</button>
      </div>

      <!-- User Table -->
      <div class="card" style="padding:0;overflow:hidden">
        <div class="table-wrapper">
          <table class="data-table">
            <thead>
              <tr>
                <th>User</th>
                <th>Username</th>
                <th>Role</th>
                <th>Email</th>
                <th>Status</th>
                <th>Created Date</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="userTableBody"></tbody>
          </table>
        </div>
      </div>

    </main>
  </div>
</div>

<!-- Add/Edit User Modal -->
<div class="modal-overlay" id="userModal">
  <div class="modal modal-md">
    <div class="modal-header">
      <div class="modal-title"><i class="bi bi-person-gear"></i> <span id="userModalTitle">Add User</span></div>
      <button class="modal-close" onclick="App.closeModal('userModal')"><i class="bi bi-x"></i></button>
    </div>
    <form id="userForm" onsubmit="saveUser(event)">
      <input type="hidden" id="userId">
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">Full Name <span class="required">*</span></label>
          <input type="text" class="form-control" id="userFullName" required placeholder="e.g. John Smith">
        </div>
        <div class="form-group">
          <label class="form-label">Username <span class="required">*</span></label>
          <input type="text" class="form-control" id="userUsername" required placeholder="e.g. jsmith">
        </div>
        <div class="form-group">
          <label class="form-label">Email Address <span class="required">*</span></label>
          <input type="email" class="form-control" id="userEmail" required placeholder="jsmith@solestock.com">
        </div>
        <div class="form-group">
          <label class="form-label">Role <span class="required">*</span></label>
          <select class="form-control" id="userRole" required>
            <option value="staff">Staff (Sales & Purchases)</option>
            <option value="manager">Manager (Full Stock & Reports)</option>
            <option value="admin">Admin (Full Access & User Mgmt)</option>
          </select>
        </div>
      </div>
      <div class="form-group" id="pwGroup">
        <label class="form-label">Password <span class="required" id="pwRequired">*</span></label>
        <input type="password" class="form-control" id="userPassword" placeholder="Enter password">
        <div class="form-hint" id="pwHint">Password will be stored securely.</div>
      </div>
      <div class="form-group" style="display:flex;align-items:center;gap:10px;margin-top:10px">
        <input type="checkbox" id="userActiveStatus" checked style="width:18px;height:18px;cursor:pointer">
        <label for="userActiveStatus" style="font-size:0.875rem;cursor:pointer;user-select:none;color:var(--text-primary)">Active Account (User can log in)</label>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" onclick="App.closeModal('userModal')">Cancel</button>
        <button type="submit" class="btn btn-primary"><i class="bi bi-floppy"></i> Save User</button>
      </div>
    </form>
  </div>
</div>

<script src="js/db.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script>
  // Guard admin page
  if (!Auth.requireRole('admin')) {
    window.location.href = 'dashboard.html';
  }

  App.initSidebar('users');
  App.initHeader('User Management', Auth.isAdmin() ? 'Manage system access, roles, and user accounts' : 'Staff Account Management (Manager View)');

  const currentSession = Auth.getSession();
  const isManagerOnly = Auth.isManager() && !Auth.isAdmin();
  let editUserId = null;

  function populateRoleDropdown(selectedRole='staff') {
    const select = document.getElementById('userRole');
    if (isManagerOnly) {
      select.innerHTML = `<option value="staff" selected>Staff (Sales & Purchases)</option>`;
    } else {
      select.innerHTML = `
        <option value="staff" ${selectedRole==='staff'?'selected':''}>Staff (Sales & Purchases)</option>
        <option value="manager" ${selectedRole==='manager'?'selected':''}>Manager (Full Stock & Reports)</option>
        <option value="admin" ${selectedRole==='admin'?'selected':''}>Admin (Full Access & User Mgmt)</option>`;
    }
  }

  function renderKPIs() {
    const allUsers = DB.getAll('users');
    const users = isManagerOnly ? allUsers.filter(u=>u.role!=='admin') : allUsers;
    const active = users.filter(u => u.active !== false).length;
    const admins = users.filter(u => u.role === 'admin').length;
    const managers = users.filter(u => u.role === 'manager').length;
    const staff = users.filter(u => u.role === 'staff').length;

    document.getElementById('userKpis').innerHTML = [
      { icon:'bi-people-fill',   cls:'purple', label:'Total Accessible',  value: users.length },
      ...(isManagerOnly ? [] : [{ icon:'bi-shield-lock-fill', cls:'red',  label:'Admins',        value: admins }]),
      { icon:'bi-briefcase-fill', cls:'cyan',  label:'Managers',      value: managers },
      { icon:'bi-person-badge-fill', cls:'green', label:'Staff Members', value: staff },
    ].map(k=>`
      <div class="kpi-card">
        <div class="kpi-icon ${k.cls}"><i class="bi ${k.icon}"></i></div>
        <div>
          <div class="kpi-label">${k.label}</div>
          <div class="kpi-value">${k.value}</div>
        </div>
      </div>`).join('');
  }

  function renderUsers() {
    const q    = document.getElementById('userSearch').value.toLowerCase();
    const role = document.getElementById('filterRole').value;
    const st   = document.getElementById('filterUserStatus').value;

    let users = DB.getAll('users').filter(u => {
      // Manager cannot view or manage Admin accounts
      if (isManagerOnly && u.role === 'admin') return false;
      if (q && !`${u.name} ${u.username} ${u.email}`.toLowerCase().includes(q)) return false;
      if (role && u.role !== role) return false;
      if (st === 'active' && u.active === false) return false;
      if (st === 'inactive' && u.active !== false) return false;
      return true;
    });

    const body = document.getElementById('userTableBody');
    if (!users.length) {
      body.innerHTML = `<tr><td colspan="7"><div class="empty-state"><i class="bi bi-person-x empty-icon"></i><h3>No users found</h3></div></td></tr>`;
      return;
    }

    const roleBadge = {
      admin:   'badge-danger',
      manager: 'badge-purple',
      staff:   'badge-info'
    };

    body.innerHTML = users.map(u => {
      const isSelf = u.id === currentSession.userId;
      const isActive = u.active !== false;
      const canEditThisUser = Auth.isAdmin() || (isManagerOnly && u.role === 'staff');
      return `
        <tr>
          <td>
            <div style="display:flex;align-items:center;gap:12px">
              <div class="user-avatar-sm">${App.initials(u.name)}</div>
              <div>
                <div class="primary">${App.escape(u.name)} ${isSelf ? '<span class="badge badge-success text-xs">You</span>' : ''}</div>
                <div class="text-xs text-muted">ID: ${u.id}</div>
              </div>
            </div>
          </td>
          <td class="fw-600">${App.escape(u.username)}</td>
          <td><span class="badge ${roleBadge[u.role]||'badge-muted'}"><i class="bi bi-shield"></i> ${u.role}</span></td>
          <td>${App.escape(u.email||'—')}</td>
          <td>
            <span class="badge ${isActive ? 'badge-success' : 'badge-danger'}">
              <i class="bi ${isActive ? 'bi-check-circle' : 'bi-x-circle'}"></i> ${isActive ? 'Active' : 'Inactive'}
            </span>
          </td>
          <td class="text-muted text-sm">${App.date(u.createdAt)}</td>
          <td>
            <div style="display:flex;gap:6px">
              ${canEditThisUser ? `<button class="btn btn-warning btn-icon btn-sm" onclick="editUser('${u.id}')" title="Edit User"><i class="bi bi-pencil"></i></button>` : ''}
              ${!isSelf && canEditThisUser ? `
                <button class="btn btn-danger btn-icon btn-sm" onclick="deleteUser('${u.id}','${App.escape(u.name)}')" title="Delete User"><i class="bi bi-trash3"></i></button>
              ` : ''}
            </div>
          </td>
        </tr>`;
    }).join('');
  }

  function clearUserFilters() {
    document.getElementById('userSearch').value = '';
    document.getElementById('filterRole').value = '';
    document.getElementById('filterUserStatus').value = '';
    renderUsers();
  }

  function openAddUserModal() {
    editUserId = null;
    document.getElementById('userForm').reset();
    document.getElementById('userId').value = '';
    document.getElementById('userModalTitle').textContent = isManagerOnly ? 'Add Staff User' : 'Add User';
    populateRoleDropdown('staff');
    document.getElementById('userPassword').required = true;
    document.getElementById('pwRequired').style.display = 'inline';
    document.getElementById('pwHint').textContent = 'Initial password for new account.';
    document.getElementById('userActiveStatus').checked = true;
    App.openModal('userModal');
  }

  function editUser(id) {
    const u = DB.getById('users', id);
    if (!u) return;
    if (isManagerOnly && u.role !== 'staff') {
      App.toast('Access Denied', 'Managers can only manage Staff accounts.', 'danger');
      return;
    }
    editUserId = id;
    document.getElementById('userModalTitle').textContent = 'Edit User';
    document.getElementById('userId').value = id;
    document.getElementById('userFullName').value = u.name;
    document.getElementById('userUsername').value = u.username;
    document.getElementById('userEmail').value = u.email||'';
    populateRoleDropdown(u.role);
    document.getElementById('userPassword').value = '';
    document.getElementById('userPassword').required = false;
    document.getElementById('pwRequired').style.display = 'none';
    document.getElementById('pwHint').textContent = 'Leave blank to keep existing password.';
    document.getElementById('userActiveStatus').checked = u.active !== false;
    App.openModal('userModal');
  }

  function saveUser(e) {
    e.preventDefault();
    const username = document.getElementById('userUsername').value.trim();
    const existing = DB.getAll('users').find(u => u.username === username && u.id !== editUserId);
    if (existing) {
      App.toast('Error', 'Username already taken.', 'danger');
      return;
    }

    const assignedRole = isManagerOnly ? 'staff' : document.getElementById('userRole').value;

    const data = {
      name:     document.getElementById('userFullName').value.trim(),
      username: username,
      email:    document.getElementById('userEmail').value.trim(),
      role:     assignedRole,
      active:   document.getElementById('userActiveStatus').checked,
    };

    const pwd = document.getElementById('userPassword').value;
    if (pwd) {
      data.password = btoa(pwd);
    }

    if (editUserId) {
      DB.update('users', editUserId, data);
      App.toast('User Updated', `${data.name} updated.`, 'success');
    } else {
      data.createdAt = new Date().toISOString();
      DB.add('users', data);
      App.toast('User Created', `Account for ${data.name} created.`, 'success');
    }

    App.closeModal('userModal');
    renderKPIs();
    renderUsers();
  }

  function deleteUser(id, name) {
    if (id === currentSession.userId) {
      App.toast('Error', 'You cannot delete your own logged in account.', 'danger');
      return;
    }
    App.confirm('Delete User', `Are you sure you want to delete user account "${name}"?`, () => {
      DB.delete('users', id);
      App.toast('User Deleted', `${name} deleted.`, 'danger');
      renderKPIs();
      renderUsers();
    });
  }

  renderKPIs();
  renderUsers();
</script>
</body>
</html>
