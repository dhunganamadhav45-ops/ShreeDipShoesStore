<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Customers — SoleStock</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/sidebar.css">
</head>
<body>
<div class="app-wrapper">
  <div id="sidebar-container"></div>
  <div class="main-wrapper">
    <div id="header-container"></div>
    <main class="main-content">

      <div class="page-header">
        <div class="page-header-top">
          <div>
            <h1>Customer Membership</h1>
            <p class="subtitle">Manage member profiles, loyalty reward points, and purchase history</p>
          </div>
          <button class="btn btn-primary" onclick="openAddCustModal()"><i class="bi bi-person-plus-fill"></i> Add Customer</button>
        </div>
      </div>

      <!-- KPI Grid -->
      <div class="kpi-grid" style="grid-template-columns:repeat(4,1fr);margin-bottom:28px" id="custKpis"></div>

      <!-- Filter Bar -->
      <div class="filter-bar">
        <div class="search-box">
          <i class="bi bi-search"></i>
          <input type="text" class="form-control" id="custSearch" placeholder="Search customer name, phone, email..." oninput="renderCustomers()">
        </div>
        <select class="form-control" id="filterTier" style="width:150px" onchange="renderCustomers()">
          <option value="">All Tiers</option>
          <option>Platinum</option>
          <option>Gold</option>
          <option>Silver</option>
          <option>Bronze</option>
        </select>
        <button class="btn btn-secondary btn-sm" onclick="clearCustFilters()"><i class="bi bi-x-circle"></i> Clear</button>
      </div>

      <!-- Table -->
      <div class="card" style="padding:0;overflow:hidden">
        <div class="table-wrapper">
          <table class="data-table">
            <thead>
              <tr>
                <th>Customer</th>
                <th>Membership Tier</th>
                <th>Phone</th>
                <th>Email</th>
                <th>Loyalty Points</th>
                <th>Total Spent</th>
                <th>Joined Date</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="custBody"></tbody>
          </table>
        </div>
      </div>

    </main>
  </div>
</div>

<!-- Add/Edit Modal -->
<div class="modal-overlay" id="custModal">
  <div class="modal modal-md">
    <div class="modal-header">
      <div class="modal-title"><i class="bi bi-person-vcard"></i> <span id="custModalTitle">Add Customer</span></div>
      <button class="modal-close" onclick="App.closeModal('custModal')"><i class="bi bi-x"></i></button>
    </div>
    <form id="custForm" onsubmit="saveCustomer(event)">
      <input type="hidden" id="custId">
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">Full Name <span class="required">*</span></label>
          <input type="text" class="form-control" id="custName" required placeholder="e.g. Sarah Jenkins">
        </div>
        <div class="form-group">
          <label class="form-label">Phone Number <span class="required">*</span></label>
          <input type="tel" class="form-control" id="custPhone" required placeholder="+1-555-0199">
        </div>
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" class="form-control" id="custEmail" placeholder="sarah@example.com">
        </div>
        <div class="form-group">
          <label class="form-label">Membership Tier</label>
          <select class="form-control" id="custTier">
            <option value="Bronze">Bronze (< Rs 10,000)</option>
            <option value="Silver">Silver (Rs 10,000+)</option>
            <option value="Gold">Gold (Rs 25,000+)</option>
            <option value="Platinum">Platinum (Rs 50,000+)</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Address</label>
        <textarea class="form-control" id="custAddress" rows="2" placeholder="Full residential / shipping address"></textarea>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" onclick="App.closeModal('custModal')">Cancel</button>
        <button type="submit" class="btn btn-primary"><i class="bi bi-floppy"></i> Save Member</button>
      </div>
    </form>
  </div>
</div>

<!-- View Profile Modal -->
<div class="modal-overlay" id="viewCustModal">
  <div class="modal modal-lg">
    <div class="modal-header">
      <div class="modal-title"><i class="bi bi-person-vcard-fill"></i> Customer Profile</div>
      <button class="modal-close" onclick="App.closeModal('viewCustModal')"><i class="bi bi-x"></i></button>
    </div>
    <div id="viewCustBody"></div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="App.closeModal('viewCustModal')">Close</button>
    </div>
  </div>
</div>

<script src="js/db.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script>
  App.initSidebar('customers');
  App.initHeader('Customer Membership', 'Manage profiles and loyalty reward records');

  let editCustId = null;

  function renderKPIs() {
    const custs = DB.getAll('customers');
    const totalPts = custs.reduce((a,c)=>a+(c.points||0),0);
    const topTiers = custs.filter(c=>['Gold','Platinum'].includes(c.tier)).length;
    const totalSpent = custs.reduce((a,c)=>a+(c.totalSpent||0),0);

    document.getElementById('custKpis').innerHTML = [
      { icon:'bi-people-fill',       cls:'purple', label:'Total Members',     value:custs.length },
      { icon:'bi-star-fill',         cls:'yellow', label:'Loyalty Points',    value:totalPts.toLocaleString() },
      { icon:'bi-gem',               cls:'pink',   label:'Gold & Platinum',   value:topTiers },
      { icon:'bi-currency-dollar',   cls:'green',  label:'Member Sales Spent',value:App.currency(totalSpent) },
    ].map(k=>`
      <div class="kpi-card">
        <div class="kpi-icon ${k.cls}"><i class="bi ${k.icon}"></i></div>
        <div>
          <div class="kpi-label">${k.label}</div>
          <div class="kpi-value">${k.value}</div>
        </div>
      </div>`).join('');
  }

  function renderCustomers() {
    const q    = document.getElementById('custSearch').value.toLowerCase();
    const tier = document.getElementById('filterTier').value;

    let custs = DB.getAll('customers').filter(c => {
      if (q && !`${c.name} ${c.phone} ${c.email||''}`.toLowerCase().includes(q)) return false;
      if (tier && c.tier !== tier) return false;
      return true;
    }).sort((a,b)=>(b.totalSpent||0)-(a.totalSpent||0));

    const body = document.getElementById('custBody');
    if (!custs.length) {
      body.innerHTML = `<tr><td colspan="8"><div class="empty-state"><i class="bi bi-person-x empty-icon"></i><h3>No members found</h3></div></td></tr>`;
      return;
    }

    body.innerHTML = custs.map(c => {
      const tInfo = DB.getCustomerTierInfo(c.totalSpent||0);
      return `
        <tr>
          <td>
            <div style="display:flex;align-items:center;gap:12px">
              <div class="user-avatar-sm">${App.initials(c.name)}</div>
              <div>
                <div class="primary">${App.escape(c.name)}</div>
                <div class="text-xs text-muted">ID: ${c.id}</div>
              </div>
            </div>
          </td>
          <td>
            <span class="badge ${tInfo.badge}">
              <i class="bi ${tInfo.icon}"></i> ${c.tier || tInfo.name}
            </span>
          </td>
          <td>${App.escape(c.phone)}</td>
          <td>${App.escape(c.email||'—')}</td>
          <td class="fw-700 text-warning"><i class="bi bi-star-fill text-xs"></i> ${(c.points||0).toLocaleString()} pts</td>
          <td class="fw-700 text-success">${App.currency(c.totalSpent||0)}</td>
          <td class="text-muted text-sm">${App.date(c.createdAt)}</td>
          <td>
            <div style="display:flex;gap:6px">
              <button class="btn btn-info btn-icon btn-sm" onclick="viewCust('${c.id}')" title="View Profile"><i class="bi bi-eye"></i></button>
              <button class="btn btn-warning btn-icon btn-sm" onclick="editCust('${c.id}')" title="Edit"><i class="bi bi-pencil"></i></button>
              <button class="btn btn-danger btn-icon btn-sm" onclick="deleteCust('${c.id}','${App.escape(c.name)}')" title="Delete"><i class="bi bi-trash3"></i></button>
            </div>
          </td>
        </tr>`;
    }).join('');
  }

  function clearCustFilters() {
    document.getElementById('custSearch').value = '';
    document.getElementById('filterTier').value = '';
    renderCustomers();
  }

  function openAddCustModal() {
    editCustId = null;
    document.getElementById('custForm').reset();
    document.getElementById('custId').value = '';
    document.getElementById('custModalTitle').textContent = 'Add Customer';
    App.openModal('custModal');
  }

  function editCust(id) {
    const c = DB.getById('customers', id);
    if (!c) return;
    editCustId = id;
    document.getElementById('custModalTitle').textContent = 'Edit Customer';
    document.getElementById('custId').value = id;
    document.getElementById('custName').value = c.name;
    document.getElementById('custPhone').value = c.phone;
    document.getElementById('custEmail').value = c.email||'';
    document.getElementById('custTier').value = c.tier||'Bronze';
    document.getElementById('custAddress').value = c.address||'';
    App.openModal('custModal');
  }

  function saveCustomer(e) {
    e.preventDefault();
    const data = {
      name:    document.getElementById('custName').value.trim(),
      phone:   document.getElementById('custPhone').value.trim(),
      email:   document.getElementById('custEmail').value.trim(),
      tier:    document.getElementById('custTier').value,
      address: document.getElementById('custAddress').value.trim(),
    };

    if (editCustId) {
      DB.update('customers', editCustId, data);
      App.toast('Updated', `Member details for ${data.name} updated.`, 'success');
    } else {
      data.totalSpent = 0;
      data.points = 0;
      data.createdAt = new Date().toISOString();
      DB.add('customers', data);
      App.toast('Member Created', `${data.name} added to customer database.`, 'success');
    }

    App.closeModal('custModal');
    renderKPIs();
    renderCustomers();
  }

  function deleteCust(id, name) {
    App.confirm('Delete Customer', `Are you sure you want to delete member profile "${name}"?`, () => {
      DB.delete('customers', id);
      App.toast('Member Deleted', `${name} removed.`, 'danger');
      renderKPIs();
      renderCustomers();
    });
  }

  function viewCust(id) {
    const c = DB.getById('customers', id);
    if (!c) return;
    const tInfo = DB.getCustomerTierInfo(c.totalSpent||0);
    const sales = DB.getAll('sales').filter(s => s.customerId === id || s.customerName === c.name);

    document.getElementById('viewCustBody').innerHTML = `
      <div style="display:flex;gap:20px;align-items:center;padding:20px;background:var(--bg-tertiary);border:1px solid var(--border);border-radius:var(--radius-lg);margin-bottom:20px">
        <div class="user-avatar-sm" style="width:64px;height:64px;font-size:1.6rem">${App.initials(c.name)}</div>
        <div style="flex:1">
          <div style="display:flex;align-items:center;gap:10px">
            <h2 style="font-size:1.3rem;font-weight:800">${App.escape(c.name)}</h2>
            <span class="badge ${tInfo.badge}"><i class="bi ${tInfo.icon}"></i> ${c.tier || tInfo.name}</span>
          </div>
          <div style="font-size:0.85rem;color:var(--text-muted);margin-top:2px">Member since ${App.date(c.createdAt)}</div>
        </div>
        <div style="text-align:right">
          <div style="font-size:0.75rem;color:var(--text-muted)">Loyalty Points</div>
          <div style="font-size:1.6rem;font-weight:800;color:var(--warning)"><i class="bi bi-star-fill text-sm"></i> ${(c.points||0).toLocaleString()}</div>
        </div>
      </div>

      <div class="form-grid-3" style="margin-bottom:24px">
        <div style="background:var(--bg-card);border:1px solid var(--border);padding:14px;border-radius:var(--radius);text-align:center">
          <div class="form-label">Total Spent</div>
          <div style="font-size:1.2rem;font-weight:800;color:var(--success)">${App.currency(c.totalSpent||0)}</div>
        </div>
        <div style="background:var(--bg-card);border:1px solid var(--border);padding:14px;border-radius:var(--radius);text-align:center">
          <div class="form-label">Total Purchases</div>
          <div style="font-size:1.2rem;font-weight:800;color:var(--text-primary)">${sales.length} sales</div>
        </div>
        <div style="background:var(--bg-card);border:1px solid var(--border);padding:14px;border-radius:var(--radius);text-align:center">
          <div class="form-label">Phone</div>
          <div style="font-size:0.9rem;font-weight:600;color:var(--text-primary)">${App.escape(c.phone)}</div>
        </div>
      </div>

      <div class="card" style="padding:0;overflow:hidden">
        <div style="padding:14px 18px;border-bottom:1px solid var(--border);font-weight:700;font-size:0.9rem;display:flex;align-items:center;gap:8px">
          <i class="bi bi-clock-history text-accent"></i> Purchase History (${sales.length})
        </div>
        <div class="table-wrapper" style="max-height:220px">
          <table class="data-table">
            <thead>
              <tr><th>Date</th><th>Shoe</th><th>Qty</th><th>Discount</th><th>Total Paid</th></tr>
            </thead>
            <tbody>
              ${sales.length ? sales.map(s => `
                <tr>
                  <td class="text-muted text-sm">${App.date(s.date)}</td>
                  <td class="primary">${App.escape(s.shoeName)}</td>
                  <td>${s.quantity}</td>
                  <td>${s.discountPercent ? `<span class="badge badge-warning">-${s.discountPercent}%</span>` : '—'}</td>
                  <td class="fw-700 text-success">${App.currency(s.totalAmount)}</td>
                </tr>`).join('') : `<tr><td colspan="5" class="text-center text-muted" style="padding:20px">No purchases recorded yet for this member.</td></tr>`}
            </tbody>
          </table>
        </div>
      </div>`;

    App.openModal('viewCustModal');
  }

  renderKPIs();
  renderCustomers();
</script>
</body>
</html>
