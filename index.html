<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SoleStock — Login</title>
  <meta name="description" content="Secure login to SoleStock shoe shop stock management system">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/main.css">
  <style>
    body { display:flex; align-items:center; justify-content:center; min-height:100vh; background:var(--bg-deep); overflow:hidden; }

    /* Animated background */
    .bg-orbs { position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:0; }
    .orb {
      position:absolute; border-radius:50%; filter:blur(80px); opacity:0.15; animation:orbFloat 10s ease-in-out infinite;
    }
    .orb-1 { width:500px;height:500px; background:radial-gradient(circle,#7c3aed,transparent); top:-100px; left:-150px; animation-delay:0s; }
    .orb-2 { width:400px;height:400px; background:radial-gradient(circle,#a855f7,transparent); bottom:-100px; right:-100px; animation-delay:-5s; }
    .orb-3 { width:300px;height:300px; background:radial-gradient(circle,#06b6d4,transparent); top:50%; left:50%; transform:translate(-50%,-50%); animation-delay:-3s; }

    @keyframes orbFloat {
      0%,100% { transform:translate(0,0) scale(1); }
      50%      { transform:translate(20px,30px) scale(1.05); }
    }

    .orb-1 { animation-name:orbFloat1; }
    @keyframes orbFloat1 {
      0%,100% { transform:translate(0,0); }
      33%     { transform:translate(30px,-20px); }
      66%     { transform:translate(-20px,30px); }
    }

    /* Login Card */
    .login-wrapper { position:relative; z-index:1; width:100%; max-width:440px; padding:20px; }

    .login-card {
      background:var(--bg-secondary);
      backdrop-filter:blur(30px);
      border:1px solid var(--border);
      border-radius:var(--radius-xl);
      padding:44px 40px;
      box-shadow:var(--shadow-lg);
      animation:cardIn 0.5s cubic-bezier(0.34,1.56,0.64,1);
    }

    @keyframes cardIn {
      from { transform:translateY(30px); opacity:0; }
      to   { transform:translateY(0);    opacity:1; }
    }

    .login-logo {
      display:flex; align-items:center; justify-content:center; gap:12px; margin-bottom:36px;
    }

    .login-logo-icon {
      width:54px; height:54px;
      border-radius:var(--radius-lg);
      background:var(--gradient);
      display:flex; align-items:center; justify-content:center;
      font-size:1.5rem; color:white;
      box-shadow:var(--shadow-accent), 0 0 30px rgba(124,58,237,0.3);
    }

    .login-logo-text .name { font-size:1.6rem; font-weight:800; color:var(--text-primary); line-height:1.1; }
    .login-logo-text .sub  { font-size:0.72rem; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.1em; }

    .login-card h1 { font-size:1.3rem; font-weight:700; color:var(--text-primary); text-align:center; margin-bottom:6px; }
    .login-card .tagline { font-size:0.85rem; color:var(--text-muted); text-align:center; margin-bottom:32px; }

    .input-wrap { position:relative; }
    .input-wrap i {
      position:absolute; left:14px; top:50%; transform:translateY(-50%);
      color:var(--text-muted); font-size:0.95rem; pointer-events:none;
    }
    .input-wrap input { padding-left:40px; }

    .pw-toggle {
      position:absolute; right:12px; top:50%; transform:translateY(-50%);
      background:none; border:none; color:var(--text-muted); cursor:pointer;
      font-size:0.95rem; padding:4px; transition:var(--transition);
    }
    .pw-toggle:hover { color:var(--text-secondary); }

    .login-btn {
      width:100%; padding:13px;
      background:var(--gradient);
      color:white; border:none; border-radius:var(--radius-sm);
      font-size:1rem; font-weight:700; font-family:'Outfit',sans-serif;
      cursor:pointer; transition:var(--transition);
      box-shadow:var(--shadow-accent);
      display:flex; align-items:center; justify-content:center; gap:8px;
    }
    .login-btn:hover { transform:translateY(-2px); box-shadow:0 8px 30px rgba(124,58,237,0.5); }
    .login-btn:active { transform:translateY(0); }
    .login-btn:disabled { opacity:0.6; pointer-events:none; }

    .login-error {
      background:var(--danger-bg); border:1px solid var(--danger-border);
      border-radius:var(--radius-sm); padding:12px 14px;
      font-size:0.85rem; color:var(--danger);
      display:flex; align-items:center; gap:8px;
      margin-bottom:18px; display:none;
    }

    .demo-credentials {
      margin-top:28px; padding:16px;
      background:rgba(124,58,237,0.06); border:1px solid var(--border-accent);
      border-radius:var(--radius-sm); text-align:center;
    }
    .demo-credentials h4 { font-size:0.78rem; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.06em; margin-bottom:10px; }
    .demo-cred-row {
      display:flex; gap:8px; flex-wrap:wrap; justify-content:center;
    }
    .demo-cred {
      background:rgba(255,255,255,0.05); border:1px solid var(--border); border-radius:6px;
      padding:6px 10px; cursor:pointer; transition:var(--transition);
    }
    .demo-cred:hover { background:var(--accent-glow); border-color:var(--border-accent); }
    .demo-cred .dc-role { font-size:0.7rem; color:var(--text-muted); display:block; }
    .demo-cred .dc-creds { font-size:0.78rem; color:var(--accent-light); font-weight:600; display:block; }

    .login-footer { text-align:center; margin-top:24px; font-size:0.75rem; color:var(--text-muted); }
    .login-footer span { color:var(--accent-light); }
  </style>
</head>
<body>
  <div class="bg-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-logo">
        <div class="login-logo-icon"><i class="bi bi-bag-heart-fill"></i></div>
        <div class="login-logo-text">
          <div class="name">SoleStock</div>
          <div class="sub">Shoe Manager</div>
        </div>
      </div>

      <h1>Welcome Back</h1>
      <p class="tagline">Sign in to manage your shoe inventory</p>

      <div class="login-error" id="loginError">
        <i class="bi bi-exclamation-circle"></i>
        <span id="loginErrorMsg">Invalid username or password.</span>
      </div>

      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label">Username</label>
          <div class="input-wrap">
            <i class="bi bi-person"></i>
            <input type="text" id="username" class="form-control" placeholder="Enter username" required autocomplete="username">
          </div>
        </div>
        <div class="form-group" style="margin-bottom:24px;">
          <label class="form-label">Password</label>
          <div class="input-wrap">
            <i class="bi bi-lock"></i>
            <input type="password" id="password" class="form-control" placeholder="Enter password" required autocomplete="current-password">
            <button type="button" class="pw-toggle" onclick="togglePw()" id="pwToggle">
              <i class="bi bi-eye" id="pwEye"></i>
            </button>
          </div>
        </div>
        <button type="submit" class="login-btn" id="loginBtn">
          <i class="bi bi-box-arrow-in-right"></i> Sign In
        </button>
      </form>

      <div class="demo-credentials">
        <h4>Demo Accounts — Click to Fill</h4>
        <div class="demo-cred-row">
          <div class="demo-cred" onclick="fillCreds('admin','admin123')">
            <span class="dc-role">Admin</span>
            <span class="dc-creds">admin / admin123</span>
          </div>
          <div class="demo-cred" onclick="fillCreds('manager','manager123')">
            <span class="dc-role">Manager</span>
            <span class="dc-creds">manager / manager123</span>
          </div>
          <div class="demo-cred" onclick="fillCreds('staff1','staff123')">
            <span class="dc-role">Staff</span>
            <span class="dc-creds">staff1 / staff123</span>
          </div>
        </div>
      </div>

      <div class="login-footer">
        <span>SoleStock</span> &mdash; Private Shoe Shop Management System &copy; 2025
      </div>
    </div>
  </div>

  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script>
    // Redirect if already logged in
    if (Auth.isLoggedIn()) window.location.href = 'dashboard.html';

    function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      btn.disabled = true;
      btn.innerHTML = '<i class="bi bi-arrow-repeat" style="animation:spin 0.7s linear infinite"></i> Signing in...';

      setTimeout(() => {
        const u = document.getElementById('username').value.trim();
        const p = document.getElementById('password').value;
        const result = Auth.login(u, p);

        if (result.ok) {
          btn.innerHTML = '<i class="bi bi-check-circle"></i> Success!';
          setTimeout(() => { window.location.href = 'dashboard.html'; }, 500);
        } else {
          const errEl = document.getElementById('loginError');
          document.getElementById('loginErrorMsg').textContent = result.msg;
          errEl.style.display = 'flex';
          btn.disabled = false;
          btn.innerHTML = '<i class="bi bi-box-arrow-in-right"></i> Sign In';
          document.getElementById('password').value = '';
        }
      }, 600);
    }

    function togglePw() {
      const inp = document.getElementById('password');
      const eye = document.getElementById('pwEye');
      if (inp.type === 'password') { inp.type = 'text'; eye.className = 'bi bi-eye-slash'; }
      else { inp.type = 'password'; eye.className = 'bi bi-eye'; }
    }

    function fillCreds(u, p) {
      document.getElementById('username').value = u;
      document.getElementById('password').value = p;
      document.getElementById('loginError').style.display = 'none';
    }
  </script>
</body>
</html>
