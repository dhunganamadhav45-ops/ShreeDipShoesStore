<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Purchases — SoleStock</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/sidebar.css">
</head>
<body>
<div class="app-wrapper">
  <div id="sidebar-container"></div>
  <div class="main-wrapper">
    <div id="header-container"></div>
    <main class="main-content">

      <div class="page-header">
        <div class="page-header-top">
          <div><h1>Purchase Management</h1><p class="subtitle">Record supplier purchases — stock auto-increases on purchase</p></div>
          <button class="btn btn-primary" onclick="openNewPurchase()"><i class="bi bi-truck"></i> New Purchase</button>
        </div>
      </div>

      <!-- KPIs -->
      <div class="kpi-grid" style="grid-template-columns:repeat(4,1fr);margin-bottom:28px" id="purchaseKpis"></div>

      <!-- Filter -->
      <div class="filter-bar">
        <div class="search-box">
          <i class="bi bi-search"></i>
          <input type="text" class="form-control" id="purchaseSearch" placeholder="Search shoe, supplier..." oninput="renderPurchases()">
        </div>
        <input type="date" class="form-control" id="pDateFrom" style="width:160px" onchange="renderPurchases()">
        <input type="date" class="form-control" id="pDateTo" style="width:160px" onchange="renderPurchases()">
        <button class="btn btn-secondary btn-sm" onclick="clearFilters()"><i class="bi bi-x-circle"></i> Clear</button>
      </div>

      <!-- Table -->
      <div class="card" style="padding:0;overflow:hidden">
        <div class="table-wrapper">
          <table class="data-table">
            <thead>
              <tr><th>Purchase ID</th><th>Supplier</th><th>Shoe</th><th>Brand</th><th>Qty</th><th>Cost/Unit</th><th>Total Cost</th><th>Date</th><th>Actions</th></tr>
            </thead>
            <tbody id="purchaseBody"></tbody>
          </table>
        </div>
        <div class="pagination" id="purchasePagination"></div>
      </div>

    </main>
  </div>
</div>

<!-- New Purchase Modal -->
<div class="modal-overlay" id="purchaseModal">
  <div class="modal modal-lg">
    <div class="modal-header">
      <div class="modal-title"><i class="bi bi-truck"></i> Record New Purchase</div>
      <button class="modal-close" onclick="App.closeModal('purchaseModal')"><i class="bi bi-x"></i></button>
    </div>
    <form onsubmit="savePurchase(event)" id="purchaseForm">
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">Supplier <span class="required">*</span></label>
          <select class="form-control" id="purchaseSupplier" required></select>
        </div>
        <div class="form-group">
          <label class="form-label">Shoe <span class="required">*</span></label>
          <select class="form-control" id="purchaseShoe" required onchange="fillPurchaseDetails()">
            <option value="">-- Select Shoe --</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Quantity <span class="required">*</span></label>
          <input type="number" class="form-control" id="purchaseQty" required min="1" placeholder="e.g. 20" oninput="calcPurchaseTotal()">
        </div>
        <div class="form-group">
          <label class="form-label">Cost Price / Unit (Rs) <span class="required">*</span></label>
          <input type="number" class="form-control" id="purchaseCost" required min="0" step="0.01" placeholder="0.00" oninput="calcPurchaseTotal()">
        </div>
        <div class="form-group">
          <label class="form-label">Purchase Date <span class="required">*</span></label>
          <input type="date" class="form-control" id="purchaseDate" required>
        </div>
        <div class="form-group">
          <label class="form-label">Total Cost</label>
          <div style="padding:10px 14px;background:var(--info-bg);border:1px solid var(--info-border);border-radius:var(--radius-sm)">
            <span id="purchaseTotalDisplay" style="font-size:1.2rem;font-weight:800;color:var(--info)">Rs 0.00</span>
          </div>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Note</label>
        <input type="text" class="form-control" id="purchaseNote" placeholder="Optional note">
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" onclick="App.closeModal('purchaseModal')">Cancel</button>
        <button type="submit" class="btn btn-primary"><i class="bi bi-floppy"></i> Save Purchase</button>
      </div>
    </form>
  </div>
</div>

<script src="js/db.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script>
  // Guard: Staff cannot access Purchase Management
  if (!Auth.requireRole(['admin', 'manager'])) { /* redirect handled */ }

  App.initSidebar('purchases');
  App.initHeader('Purchase Management', 'Track all supplier purchases');
  App.handleHash();

  const session = Auth.getSession();
  const ITEMS = 15;
  let pg = 1;

  function renderKPIs() {
    const purchases = DB.getAll('purchases');
    const today = new Date().toISOString().split('T')[0];
    const month = today.slice(0,7);
    const totalSpent = purchases.reduce((a,p)=>a+p.totalCost,0);
    const monthSpent = purchases.filter(p=>p.purchaseDate.startsWith(month)).reduce((a,p)=>a+p.totalCost,0);
    const totalUnits = purchases.reduce((a,p)=>a+p.quantity,0);
    document.getElementById('purchaseKpis').innerHTML = [
      { icon:'bi-receipt',        cls:'purple', label:'Total Purchases',  value:purchases.length },
      { icon:'bi-boxes',          cls:'cyan',   label:'Total Units Bought',value:totalUnits.toLocaleString() },
      { icon:'bi-calendar3',      cls:'orange', label:'Month Spending',   value:App.currency(monthSpent) },
      { icon:'bi-currency-dollar',cls:'red',    label:'Total Spent',      value:App.currency(totalSpent) },
    ].map(k=>`
      <div class="kpi-card">
        <div class="kpi-icon ${k.cls}"><i class="bi ${k.icon}"></i></div>
        <div>
          <div class="kpi-label">${k.label}</div>
          <div class="kpi-value">${k.value}</div>
        </div>
      </div>`).join('');
  }

  function renderPurchases() {
    const q  = document.getElementById('purchaseSearch').value.toLowerCase();
    const df = document.getElementById('pDateFrom').value;
    const dt = document.getElementById('pDateTo').value;
    let purchases = DB.getAll('purchases').filter(p => {
      if (q && !`${p.shoeName} ${p.supplierName} ${p.id}`.toLowerCase().includes(q)) return false;
      if (df && p.purchaseDate < df) return false;
      if (dt && p.purchaseDate > dt) return false;
      return true;
    }).reverse();

    const total = purchases.length;
    const pages = Math.max(1, Math.ceil(total/ITEMS));
    if (pg>pages) pg=1;
    const slice = purchases.slice((pg-1)*ITEMS, pg*ITEMS);

    const body = document.getElementById('purchaseBody');
    body.innerHTML = slice.length ? slice.map(p=>`
      <tr>
        <td class="text-accent text-sm">#${p.id}</td>
        <td>${App.escape(p.supplierName||'—')}</td>
        <td class="primary">${App.escape(p.shoeName)}</td>
        <td><span class="badge badge-purple">${App.escape(p.brand||'—')}</span></td>
        <td class="fw-600">${p.quantity}</td>
        <td>${App.currency(p.costPrice)}</td>
        <td class="fw-700 text-info">${App.currency(p.totalCost)}</td>
        <td class="text-muted text-sm">${App.date(p.purchaseDate)}</td>
        <td><span class="badge badge-success"><i class="bi bi-check-circle"></i> Received</span></td>
      </tr>`).join('')
    : `<tr><td colspan="9"><div class="empty-state"><i class="bi bi-truck empty-icon"></i><h3>No purchases found</h3></div></td></tr>`;

    const pgEl = document.getElementById('purchasePagination');
    if (pages<=1){pgEl.innerHTML='';return;}
    let ph=`<span class="page-info">${(pg-1)*ITEMS+1}–${Math.min(pg*ITEMS,total)} of ${total}</span>`;
    ph+=`<button class="page-btn" onclick="spg(${pg-1})" ${pg===1?'disabled':''}><i class="bi bi-chevron-left"></i></button>`;
    for(let i=1;i<=pages;i++) ph+=`<button class="page-btn ${i===pg?'active':''}" onclick="spg(${i})">${i}</button>`;
    ph+=`<button class="page-btn" onclick="spg(${pg+1})" ${pg===pages?'disabled':''}><i class="bi bi-chevron-right"></i></button>`;
    pgEl.innerHTML=ph;
  }

  function spg(p){pg=p;renderPurchases();}
  function clearFilters(){['purchaseSearch','pDateFrom','pDateTo'].forEach(id=>document.getElementById(id).value='');renderPurchases();}

  function openNewPurchase() {
    document.getElementById('purchaseForm').reset();
    const shoes = DB.getAll('shoes');
    const sups  = DB.getAll('suppliers');
    document.getElementById('purchaseShoe').innerHTML = `<option value="">-- Select Shoe --</option>` +
      shoes.map(s=>`<option value="${s.id}">${App.escape(s.name)} (${App.escape(s.brand)})</option>`).join('');
    document.getElementById('purchaseSupplier').innerHTML = `<option value="">-- Select Supplier --</option>` +
      sups.map(s=>`<option value="${s.id}">${App.escape(s.company)}</option>`).join('');
    document.getElementById('purchaseDate').value = new Date().toISOString().split('T')[0];
    document.getElementById('purchaseTotalDisplay').textContent = 'Rs 0.00';
    App.openModal('purchaseModal');
  }

  function fillPurchaseDetails() {
    const shoeId = document.getElementById('purchaseShoe').value;
    if (!shoeId) return;
    const shoe = DB.getById('shoes', shoeId);
    if (!shoe) return;
    document.getElementById('purchaseCost').value = shoe.purchasePrice;
    calcPurchaseTotal();
    // Auto-select supplier if shoe has one
    if (shoe.supplierId) document.getElementById('purchaseSupplier').value = shoe.supplierId;
  }

  function calcPurchaseTotal() {
    const qty  = parseFloat(document.getElementById('purchaseQty').value)||0;
    const cost = parseFloat(document.getElementById('purchaseCost').value)||0;
    document.getElementById('purchaseTotalDisplay').textContent = App.currency(qty*cost);
  }

  function savePurchase(e) {
    e.preventDefault();
    const shoeId = document.getElementById('purchaseShoe').value;
    const supId  = document.getElementById('purchaseSupplier').value;
    const shoe   = DB.getById('shoes', shoeId);
    const sup    = supId ? DB.getById('suppliers', supId) : null;
    if (!shoe) return;

    const res = DB.recordPurchase({
      supplierId: supId, supplierName: sup ? sup.company : 'Unknown',
      shoeId, shoeName: shoe.name, brand: shoe.brand,
      quantity: parseInt(document.getElementById('purchaseQty').value)||0,
      costPrice: parseFloat(document.getElementById('purchaseCost').value)||0,
      purchaseDate: document.getElementById('purchaseDate').value,
      note: document.getElementById('purchaseNote').value.trim(),
      userId: session.userId,
    });

    if (res.ok) {
      App.closeModal('purchaseModal');
      App.toast('Purchase Recorded', `${shoe.name} × ${res.purchase.quantity} added to stock.`, 'success');
      renderKPIs();
      renderPurchases();
    } else {
      App.toast('Error', res.msg, 'danger');
    }
  }

  renderKPIs();
  renderPurchases();
</script>
</body>
</html>
