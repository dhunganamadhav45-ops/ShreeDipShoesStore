<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sales — SoleStock</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/sidebar.css">
</head>
<body>
<div class="app-wrapper">
  <div id="sidebar-container"></div>
  <div class="main-wrapper">
    <div id="header-container"></div>
    <main class="main-content">

      <div class="page-header">
        <div class="page-header-top">
          <div><h1>Sales Management</h1><p class="subtitle">Record sales and track revenue — stock auto-reduces on sale</p></div>
          <button class="btn btn-primary" onclick="openNewSale()"><i class="bi bi-cart-plus-fill"></i> New Sale</button>
        </div>
      </div>

      <!-- KPIs -->
      <div class="kpi-grid" style="grid-template-columns:repeat(4,1fr);margin-bottom:28px" id="salesKpis"></div>

      <!-- Filter -->
      <div class="filter-bar">
        <div class="search-box">
          <i class="bi bi-search"></i>
          <input type="text" class="form-control" id="saleSearch" placeholder="Search shoe, customer..." oninput="renderSales()">
        </div>
        <input type="date" class="form-control" id="dateFrom" style="width:160px" onchange="renderSales()">
        <input type="date" class="form-control" id="dateTo" style="width:160px" onchange="renderSales()">
        <button class="btn btn-secondary btn-sm" onclick="clearSaleFilters()"><i class="bi bi-x-circle"></i> Clear</button>
      </div>

      <!-- Sales Table -->
      <div class="card" style="padding:0;overflow:hidden">
        <div class="table-wrapper">
          <table class="data-table">
            <thead>
              <tr><th>Sale ID</th><th>Shoe</th><th>Brand</th><th>Size</th><th>Qty</th><th>Unit Price</th><th>Total</th><th>Customer</th><th>Date</th><th>Actions</th></tr>
            </thead>
            <tbody id="salesBody"></tbody>
          </table>
        </div>
        <div class="pagination" id="salesPagination"></div>
      </div>

    </main>
  </div>
</div>

<!-- New Sale Modal -->
<div class="modal-overlay" id="saleModal">
  <div class="modal modal-lg">
    <div class="modal-header">
      <div class="modal-title"><i class="bi bi-cart-plus-fill"></i> Record New Sale</div>
      <button class="modal-close" onclick="App.closeModal('saleModal')"><i class="bi bi-x"></i></button>
    </div>
    <form onsubmit="saveSale(event)" id="saleForm">
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">Shoe <span class="required">*</span></label>
          <select class="form-control" id="saleShoe" required onchange="fillSaleDetails()">
            <option value="">-- Select Shoe --</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Customer / Member</label>
          <select class="form-control" id="saleCustomerSelect">
            <option value="">-- Walk-in Customer --</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Discount (%)</label>
          <input type="number" class="form-control" id="saleDiscount" min="0" max="100" step="0.5" placeholder="0" oninput="calcSaleTotal()">
        </div>
        <div class="form-group">
          <label class="form-label">Size</label>
          <input type="text" class="form-control" id="saleSizeDisplay" readonly style="opacity:0.7">
        </div>
        <div class="form-group">
          <label class="form-label">Available Stock</label>
          <input type="text" class="form-control" id="saleAvailable" readonly style="opacity:0.7">
        </div>
        <div class="form-group">
          <label class="form-label">Quantity <span class="required">*</span></label>
          <input type="number" class="form-control" id="saleQty" required min="1" placeholder="1" oninput="calcSaleTotal()">
        </div>
        <div class="form-group">
          <label class="form-label">Selling Price (Rs) <span class="required">*</span></label>
          <input type="number" class="form-control" id="salePrice" required min="0" step="0.01" placeholder="0.00" oninput="calcSaleTotal()">
        </div>
        <div class="form-group">
          <label class="form-label">Sale Date <span class="required">*</span></label>
          <input type="date" class="form-control" id="saleDate" required>
        </div>
        <div class="form-group">
          <label class="form-label">Final Total</label>
          <div style="padding:10px 14px;background:var(--success-bg);border:1px solid var(--success-border);border-radius:var(--radius-sm);">
            <div id="saleTotalDisplay" style="font-size:1.2rem;font-weight:800;color:var(--success)">Rs 0.00</div>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" onclick="App.closeModal('saleModal')">Cancel</button>
        <button type="submit" class="btn btn-primary"><i class="bi bi-cart-check"></i> Record Sale</button>
      </div>
    </form>
  </div>
</div>

<!-- View Sale Modal -->
<div class="modal-overlay" id="viewSaleModal">
  <div class="modal modal-sm">
    <div class="modal-header">
      <div class="modal-title"><i class="bi bi-receipt"></i> Sale Receipt</div>
      <button class="modal-close" onclick="App.closeModal('viewSaleModal')"><i class="bi bi-x"></i></button>
    </div>
    <div id="viewSaleBody"></div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="App.closeModal('viewSaleModal')">Close</button>
    </div>
  </div>
</div>

<script src="js/db.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script>
  App.initSidebar('sales');
  App.initHeader('Sales Management', 'Record and track all shoe sales');
  App.handleHash();

  const session = Auth.getSession();
  const ITEMS = 15;
  let pg = 1;

  function renderKPIs() {
    const stats = DB.getStats();
    document.getElementById('salesKpis').innerHTML = [
      { icon:'bi-cart-check-fill',   cls:'green',  label:"Today's Sales",   value:stats.todaySalesCount,   sub:App.currency(stats.todayRevenue) },
      { icon:'bi-calendar3',         cls:'purple',  label:'Monthly Sales',   value:stats.monthSalesCount,   sub:App.currency(stats.monthRevenue) },
      { icon:'bi-graph-up-arrow',    cls:'cyan',   label:"Today's Profit",  value:App.currency(stats.todayProfit) },
      { icon:'bi-currency-dollar',   cls:'pink',   label:'Total Revenue',   value:App.currency(stats.totalRevenue) },
    ].map(k=>`
      <div class="kpi-card">
        <div class="kpi-icon ${k.cls}"><i class="bi ${k.icon}"></i></div>
        <div>
          <div class="kpi-label">${k.label}</div>
          <div class="kpi-value">${k.value}</div>
          ${k.sub ? `<div class="kpi-sub">${k.sub}</div>` : ''}
        </div>
      </div>`).join('');
  }

  function renderSales() {
    const q  = document.getElementById('saleSearch').value.toLowerCase();
    const df = document.getElementById('dateFrom').value;
    const dt = document.getElementById('dateTo').value;
    let sales = DB.getAll('sales').filter(s => {
      if (q && !`${s.shoeName} ${s.customerName} ${s.id}`.toLowerCase().includes(q)) return false;
      if (df && s.date < df) return false;
      if (dt && s.date > dt) return false;
      return true;
    }).reverse();

    const total = sales.length;
    const pages = Math.max(1, Math.ceil(total/ITEMS));
    if (pg>pages) pg=1;
    const slice = sales.slice((pg-1)*ITEMS, pg*ITEMS);

    const body = document.getElementById('salesBody');
    body.innerHTML = slice.length ? slice.map(s=>`
      <tr>
        <td class="text-accent text-sm">#${s.id}</td>
        <td class="primary">${App.escape(s.shoeName)}</td>
        <td><span class="badge badge-purple">${App.escape(s.brand||'—')}</span></td>
        <td>${App.escape(s.size||'—')}</td>
        <td class="fw-600">${s.quantity}</td>
        <td>${App.currency(s.sellingPrice)}</td>
        <td class="fw-700 text-success">
          ${App.currency(s.totalAmount)}
          ${s.discountPercent ? `<span class="badge badge-warning text-xs" style="margin-left:4px">-${s.discountPercent}%</span>` : ''}
        </td>
        <td>${s.customerName ? App.escape(s.customerName) : '<span class="text-muted">Walk-in</span>'}</td>
        <td class="text-muted text-sm">${App.date(s.date)}</td>
        <td>
          <button class="btn btn-info btn-xs" onclick="viewSale('${s.id}')"><i class="bi bi-eye"></i> View</button>
        </td>
      </tr>`).join('')
    : `<tr><td colspan="10"><div class="empty-state"><i class="bi bi-cart empty-icon"></i><h3>No sales found</h3></div></td></tr>`;

    // Pagination
    const pgEl = document.getElementById('salesPagination');
    if (pages<=1){pgEl.innerHTML='';return;}
    let ph=`<span class="page-info">${(pg-1)*ITEMS+1}–${Math.min(pg*ITEMS,total)} of ${total}</span>`;
    ph+=`<button class="page-btn" onclick="spg(${pg-1})" ${pg===1?'disabled':''}><i class="bi bi-chevron-left"></i></button>`;
    for(let i=1;i<=pages;i++) ph+=`<button class="page-btn ${i===pg?'active':''}" onclick="spg(${i})">${i}</button>`;
    ph+=`<button class="page-btn" onclick="spg(${pg+1})" ${pg===pages?'disabled':''}><i class="bi bi-chevron-right"></i></button>`;
    pgEl.innerHTML=ph;
  }

  function spg(p){pg=p;renderSales();}
  function clearSaleFilters(){['saleSearch','dateFrom','dateTo'].forEach(id=>{document.getElementById(id).value='';});renderSales();}

  function openNewSale() {
    document.getElementById('saleForm').reset();
    const shoes = DB.getAll('shoes');
    const custs = DB.getAll('customers');
    document.getElementById('saleShoe').innerHTML = `<option value="">-- Select Shoe --</option>` +
      shoes.map(s=>`<option value="${s.id}">${App.escape(s.name)} (${App.escape(s.brand)}) — ${s.quantity} in stock</option>`).join('');
    document.getElementById('saleCustomerSelect').innerHTML = `<option value="">-- Walk-in Customer --</option>` +
      custs.map(c=>`<option value="${c.id}">${App.escape(c.name)} (${c.tier||'Member'})</option>`).join('');
    document.getElementById('saleDate').value = new Date().toISOString().split('T')[0];
    document.getElementById('saleTotalDisplay').textContent = 'Rs 0.00';
    document.getElementById('saleAvailable').value = '';
    document.getElementById('saleSizeDisplay').value = '';
    document.getElementById('saleDiscount').value = '';
    App.openModal('saleModal');
  }

  function fillSaleDetails() {
    const shoeId = document.getElementById('saleShoe').value;
    if (!shoeId) return;
    const shoe = DB.getById('shoes', shoeId);
    if (!shoe) return;
    document.getElementById('salePrice').value = shoe.sellingPrice;
    document.getElementById('saleAvailable').value = shoe.quantity + ' units';
    document.getElementById('saleSizeDisplay').value = shoe.size;
    document.getElementById('saleQty').max = shoe.quantity;
    calcSaleTotal();
  }

  function calcSaleTotal() {
    const qty      = parseFloat(document.getElementById('saleQty').value)||0;
    const price    = parseFloat(document.getElementById('salePrice').value)||0;
    const discount = parseFloat(document.getElementById('saleDiscount').value)||0;
    const subtotal = qty * price;
    const discAmt  = subtotal * (discount / 100);
    const final    = Math.max(0, subtotal - discAmt);
    const disp = document.getElementById('saleTotalDisplay');
    disp.innerHTML = `
      ${App.currency(final)}
      ${discount > 0 ? `<div style="font-size:0.75rem;color:var(--warning);font-weight:600">Saved ${App.currency(discAmt)} (${discount}% discount)</div>` : ''}`;
  }

  function saveSale(e) {
    e.preventDefault();
    const shoeId = document.getElementById('saleShoe').value;
    const shoe   = DB.getById('shoes', shoeId);
    const qty    = parseInt(document.getElementById('saleQty').value)||0;
    if (!shoe) return;
    if (qty > shoe.quantity) { App.toast('Error', `Only ${shoe.quantity} in stock.`, 'danger'); return; }

    const custId = document.getElementById('saleCustomerSelect').value;
    const cust   = custId ? DB.getById('customers', custId) : null;

    const res = DB.recordSale({
      shoeId, shoeName: shoe.name, brand: shoe.brand, size: shoe.size,
      quantity: qty,
      sellingPrice: parseFloat(document.getElementById('salePrice').value)||shoe.sellingPrice,
      discountPercent: parseFloat(document.getElementById('saleDiscount').value)||0,
      date: document.getElementById('saleDate').value,
      customerId: custId || '',
      customerName: cust ? cust.name : 'Walk-in Customer',
      staffId: session.userId,
    });

    if (res.ok) {
      App.closeModal('saleModal');
      App.toast('Sale Recorded', `${shoe.name} × ${qty} — ${App.currency(res.sale.totalAmount)}`, 'success');
      renderKPIs();
      renderSales();
    } else {
      App.toast('Error', res.msg, 'danger');
    }
  }

  function viewSale(id) {
    const s = DB.getById('sales', id);
    if (!s) return;
    const shoe = DB.getById('shoes', s.shoeId);
    const subtotal = s.sellingPrice * s.quantity;
    const profit = shoe ? (s.sellingPrice - shoe.purchasePrice) * s.quantity - (s.discountAmount||0) : 0;
    document.getElementById('viewSaleBody').innerHTML = `
      <div style="display:flex;flex-direction:column;gap:14px">
        <div style="display:flex;justify-content:space-between;align-items:center;padding:16px;background:var(--success-bg);border:1px solid var(--success-border);border-radius:var(--radius)">
          <div>
            <span style="font-size:0.75rem;color:var(--text-muted);display:block">Final Paid Amount</span>
            ${s.discountPercent ? `<span class="badge badge-warning">-${s.discountPercent}% Discount</span>` : ''}
          </div>
          <span style="font-size:1.8rem;font-weight:800;color:var(--success)">${App.currency(s.totalAmount)}</span>
        </div>
        ${[
          ['Sale ID','#'+s.id],
          ['Shoe',s.shoeName],
          ['Brand',s.brand||'—'],
          ['Size',s.size||'—'],
          ['Quantity',s.quantity+' units'],
          ['Unit Price',App.currency(s.sellingPrice)],
          ['Subtotal',App.currency(subtotal)],
          ...(s.discountPercent ? [['Discount', `${s.discountPercent}% (${App.currency(s.discountAmount)})`]] : []),
          ['Date',App.date(s.date)],
          ['Customer',s.customerName||'Walk-in'],
          ['Estimated Profit',App.currency(profit)]
        ].map(([l,v])=>`
          <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)">
            <span style="font-size:0.82rem;color:var(--text-muted)">${l}</span>
            <span style="font-size:0.875rem;font-weight:600;color:var(--text-primary)">${App.escape(String(v))}</span>
          </div>`).join('')}
      </div>`;
    App.openModal('viewSaleModal');
  }

  renderKPIs();
  renderSales();
</script>
</body>
</html>
